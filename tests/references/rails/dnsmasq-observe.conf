# dnsmasq 観察モード設定
# 制限は行わず、全クエリをログに記録する。
# フェーズ1完了後は dnsmasq.conf（制限モード）に切り替える。

log-queries
log-facility=/var/log/dnsmasq.log

# 外部DNSサーバーを直接指定（/etc/resolv.conf は使わない）
no-resolv
server=1.1.1.1
server=8.8.8.8

cache-size=1000

# Docker内部サービス名の解決はDocker DNSに委譲
server=/db/127.0.0.11
server=/redis/127.0.0.11
