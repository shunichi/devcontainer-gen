project:
  name: my-rails-app

container:
  timezone: Asia/Tokyo
  firewall_mode: restrict

languages:
  ruby:
    version: "3.4.5"
  node:
    version: "22"
    package_manager: pnpm
    pnpm_version: "10.32.1"

tools:
  git_delta: "0.18.2"
  zsh_in_docker: "1.2.0"

system_packages:
  - build-essential
  - libpq-dev
  - libvips

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata-16:/var/lib/postgresql/data
    ports:
      - "15432:5432"
  redis:
    image: redis:7
    volumes:
      - redis-data-7:/data

vscode:
  extensions:
    - anthropic.claude-code
    - Shopify.ruby-lsp
    - eamodio.gitlens
    - KoichiSasada.vscode-rdbg
  settings:
    terminal.integrated.defaultProfile.linux: zsh
    debug.javascript.autoAttachFilter: disabled

mounts:
  - name: pnpm-store
    target: /workspace/.pnpm-store
  - name: node-modules
    target: /workspace/node_modules
  - name: bundle-cache
    target: /usr/local/bundle
  - name: vendor-bundle
    target: /workspace/vendor/bundle

container_env:
  NODE_OPTIONS: "--max-old-space-size=4096 --dns-result-order=ipv4first"
  DATABASE_CONFIG: config/database.devcontainer.yml
  REDIS_URL: redis://redis:6379/1

allowed_domains:
  - group: RubyGems
    domains:
      - rubygems.org
  - group: npm
    domains:
      - npmjs.org
      - npmjs.com
  - group: GitHub
    domains:
      - github.com
      - githubusercontent.com
      - githubassets.com
  - group: Claude Code
    domains:
      - anthropic.com
      - claude.com
      - claude.ai
      - statsig.com
  - group: CopyTuner
    domains:
      - copy-tuner.sg-apps.com
  - group: GitHub Copilot
    domains:
      - githubcopilot.com
  - group: VS Code 拡張機能
    domains:
      - marketplace.visualstudio.com
      - vscode-cdn.net
      - vsassets.io
      - vscode.blob.core.windows.net
      - update.code.visualstudio.com
      - azure.cn
  - group: JSON スキーマ
    domains:
      - schemastore.org
  - group: TLS 証明書失効確認
    domains:
      - digicert.com
      - microsoft.com

ports:
  - port: 3000
    label: Rails
    on_auto_forward: notify

compose:
  app_environment:
    RUBYOPT: "-EUTF-8"

lifecycle:
  post_create: "bundle install && pnpm install"
