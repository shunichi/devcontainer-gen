project:
  name: my-rails-app

container:
  base_image: "ruby:3.4.5-bookworm"
  user: dev
  timezone: Asia/Tokyo
  firewall_mode: restrict

languages:
  ruby:
    version: "3.4.5"
  node:
    version: "22"
    package_manager: pnpm
    pnpm_version: "10.32.1"

tools:
  claude_code: latest
  git_delta: "0.18.2"
  zsh_in_docker: "1.2.0"

system_packages:
  - locales
  - build-essential
  - libpq-dev
  - libvips

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
  redis:
    image: redis:7
    volumes:
      - redis-data:/data

vscode:
  extensions:
    - anthropic.claude-code
    - Shopify.ruby-lsp
    - eamodio.gitlens
    - KoichiSasada.vscode-rdbg
  settings:
    terminal.integrated.defaultProfile.linux: zsh
    debug.javascript.autoAttachFilter: disabled

mounts:
  - name: pnpm-store
    target: /workspace/.pnpm-store
  - name: node-modules
    target: /workspace/node_modules
  - name: bundle-cache
    target: /usr/local/bundle
  - name: vendor-bundle
    target: /workspace/vendor/bundle

container_env:
  DATABASE_CONFIG: config/database.devcontainer.yml
  REDIS_URL: redis://redis:6379/1

allowed_domains:
  - group: CopyTuner
    domains:
      - copy-tuner.sg-apps.com

ports:
  - port: 3000
    label: Rails
    on_auto_forward: notify

compose:
  app_environment:
    RUBYOPT: "-EUTF-8"

lifecycle:
  post_create: "bundle install && pnpm install"

dockerfile:
  pre_create_dirs:
    - .pnpm-store
    - node_modules
    - vendor/bundle
