project:
  name: my-node-app

container:
  timezone: Asia/Tokyo
  firewall_mode: restrict

languages:
  node:
    version: "22"
    package_manager: pnpm
    pnpm_version: "10.30.0"

tools:
  git_delta: "0.18.2"
  zsh_in_docker: "1.2.0"

vscode:
  extensions:
    - anthropic.claude-code
    - biomejs.biome
    - eamodio.gitlens
  settings:
    editor.defaultFormatter: biomejs.biome
    editor.formatOnSave: true
    terminal.integrated.defaultProfile.linux: zsh
    debug.javascript.autoAttachFilter: disabled

mounts:
  - name: pnpm-store
    target: /workspace/.pnpm-store
  - name: node-modules
    target: /workspace/node_modules

container_env:
  NODE_OPTIONS: "--max-old-space-size=4096 --dns-result-order=ipv4first"

allowed_domains:
  - group: npm
    domains:
      - npmjs.org
      - npmjs.com
  - group: GitHub
    domains:
      - github.com
      - githubusercontent.com
      - githubassets.com
  - group: Claude Code
    domains:
      - anthropic.com
      - claude.com
      - claude.ai
      - statsig.com
  - group: GitHub Copilot
    domains:
      - githubcopilot.com
  - group: VS Code 拡張機能
    domains:
      - marketplace.visualstudio.com
      - vscode-cdn.net
      - vsassets.io
      - vscode.blob.core.windows.net
      - update.code.visualstudio.com
      - azure.cn
  - group: JSON スキーマ
    domains:
      - schemastore.org
  - group: TLS 証明書失効確認
    domains:
      - digicert.com
      - microsoft.com

ports:
  - port: 3000
    label: "Dev Server"
    on_auto_forward: notify

lifecycle:
  post_create: "pnpm install"
